<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="flBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181310"/>
      <stop offset="100%" stop-color="#2d1607"/>
    </linearGradient>
    <linearGradient id="flOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#flBg)" stroke="#ff6b00" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#ff8c00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Flash Lightning Bolt -->
  <polygon points="68,18 36,62 58,62 48,102 86,52 64,52" fill="url(#flOrange)" filter="url(#glow)"/>
  <text x="60" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">TEAM FLASH</text>
</svg>